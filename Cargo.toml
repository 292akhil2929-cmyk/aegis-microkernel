[package]
name = "aegis-microkernel"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A capability-first ARM64 teaching microkernel for QEMU virt"

[features]
default = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[[bin]]
name = "aegis-kernel"
path = "src/main.rs"
test = false
bench = false
