name: kernel-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat
      - name: Host mechanism tests
        run: cargo test --target x86_64-unknown-linux-gnu --lib
      - name: ARM64 release kernel
        run: cargo build --release
      - name: Boot smoke test on QEMU virt
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          set +e
          timeout 8s qemu-system-aarch64 \
            -M virt,gic-version=2 -cpu cortex-a72 -m 256M -smp 1 \
            -nographic -monitor none -serial stdio \
            -kernel target/aarch64-unknown-none-softfloat/release/aegis-kernel \
            | tee qemu-boot.log
          set -e
          grep -F '[Aegis] Hello from the kernel' qemu-boot.log
          grep -F '[mmu] stage-1 identity map: ON' qemu-boot.log
          grep -F '[memory] frame allocator + W^X descriptor: PASS' qemu-boot.log
          grep -F '[caps] sandbox UART capability: DENIED' qemu-boot.log
          grep -F '[ipc] synchronous rendezvous self-test: PASS' qemu-boot.log
          grep -F '[syscall] typed endpoint authorization: PASS' qemu-boot.log
          grep -F '[sched] round-robin policy self-test: PASS' qemu-boot.log
          grep -F '[timer] EL1 IRQ delivery: PASS (3 ticks)' qemu-boot.log
          grep -F '[el0] SVC yield round-trip: PASS' qemu-boot.log
          grep -F '[ipc] app Call -> console Receive: PASS' qemu-boot.log
          grep -F '[console-server] capability-authorized write: PASS' qemu-boot.log
          grep -F '[ipc] console Reply -> app resume: PASS' qemu-boot.log
          grep -F '[caps] root revoked console grant subtree: PASS' qemu-boot.log
          grep -F '[caps] post-revocation console Call: DENIED' qemu-boot.log
          grep -F '[el0] direct PL011 access: DENIED by stage-1 MMU' qemu-boot.log
          grep -F '[ready] milestone 4 EL0 isolation proof complete' qemu-boot.log
      - name: Linker and formatting checks
        run: |
          cargo fmt -- --check
          git diff --check
